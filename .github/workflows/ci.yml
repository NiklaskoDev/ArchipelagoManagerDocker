name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      ap_version:
        description: "Archipelago release to bundle and test against (default: the one pinned in the Dockerfile)"
        required: false
        default: ""

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            manager/requirements.txt
            tests/requirements.txt

      - name: Find the Archipelago version
        id: ap
        run: |
          version="${{ inputs.ap_version }}"
          if [ -z "$version" ]; then
            version="$(sed -n 's/^ARG AP_VERSION=//p' Dockerfile | head -1)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Testing against Archipelago $version"

      - name: Fetch Archipelago
        run: git clone --depth 1 --branch "${{ steps.ap.outputs.version }}" https://github.com/ArchipelagoMW/Archipelago.git "$RUNNER_TEMP/archipelago"

      # The same steps as the Dockerfile, so a broken requirement shows up here as well as in the image build.
      - name: Install Archipelago's requirements
        working-directory: ${{ runner.temp }}/archipelago
        run: |
          python -m venv "$RUNNER_TEMP/venv-ap"
          grep -v -i -E '^(kivy|kivymd|pyshortcuts)' requirements.txt > "$RUNNER_TEMP/core-requirements.txt"
          "$RUNNER_TEMP/venv-ap/bin/pip" install -r "$RUNNER_TEMP/core-requirements.txt" "setuptools>=75,<81" requests
          for requirements in worlds/*/requirements.txt; do
            "$RUNNER_TEMP/venv-ap/bin/pip" install -r "$requirements" --constraint "$RUNNER_TEMP/core-requirements.txt"
          done

      - name: Install the manager's and the tests' requirements
        run: pip install -r tests/requirements.txt ruff

      - name: Lint
        run: ruff check manager tests

      - name: Check JavaScript syntax
        run: |
          for file in $(find manager/archipelago_manager/static/js -name '*.js'); do
            node --check --input-type=module < "$file" || { echo "syntax error in $file"; exit 1; }
          done

      - name: Test
        env:
          AP_DIR: ${{ runner.temp }}/archipelago
          AP_PYTHON: ${{ runner.temp }}/venv-ap/bin/python
        run: pytest --basetemp "$RUNNER_TEMP/pytest"

      - name: Keep the server logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: server-logs
          path: ${{ runner.temp }}/pytest/**/*.log
          if-no-files-found: ignore

  docker:
    name: Build image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Work out names
        id: names
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          version="${{ inputs.ap_version }}"
          if [ -z "$version" ]; then
            version="$(sed -n 's/^ARG AP_VERSION=//p' Dockerfile | head -1)"
          fi
          echo "ap_version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.names.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=ap-${{ steps.names.outputs.ap_version }},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: archipelago-manager:smoke
          build-args: |
            AP_VERSION=${{ steps.names.outputs.ap_version }}
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Runs the image as users of Unraid do (unprivileged user 99:100, game ports published) and plays through a
      # whole generate-host-connect cycle.
      - name: Smoke test the image
        run: |
          mkdir -p "$RUNNER_TEMP/smoke-config"
          docker run -d --name smoke -p 8080:8080 -p 38281-38300:38281-38300 \
            -v "$RUNNER_TEMP/smoke-config:/config" archipelago-manager:smoke
          if ! python tests/smoke.py http://127.0.0.1:8080 127.0.0.1; then
            docker logs smoke
            exit 1
          fi
          # docker top runs ps on the host (the slim image has none) and insists on a PID column. Only the python
          # process counts: tini, running as root, carries the same words in its arguments.
          echo "--- processes"
          docker top smoke -eo pid,uid,args
          docker top smoke -eo pid,uid,args | awk '
            $3 ~ /(^|\/)python[0-9.]*$/ && $4 == "-m" && $5 == "archipelago_manager" { found = 1; if ($2 != 99) bad = 1 }
            END { exit !(found && !bad) }' || { echo "the manager is not running as user 99"; exit 1; }
          echo "--- data folder ownership"
          docker exec smoke ls -ln /config
          docker exec smoke find /config ! -user 99 -print -quit | grep -q . && { echo "files not owned by 99"; exit 1; } || true
          docker inspect --format '{{json .State.Health.Status}}' smoke
          docker stop --time 30 smoke
          docker logs smoke | tail -20

      # Images come from the default branch and version tags only. Other branches, such as the ones the
      # Archipelago update workflow opens, are built and smoke tested above but not published.
      - name: Log in to the registry
        if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/'))
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/'))
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            AP_VERSION=${{ steps.names.outputs.ap_version }}
            VERSION=${{ github.sha }}
          cache-from: type=gha
