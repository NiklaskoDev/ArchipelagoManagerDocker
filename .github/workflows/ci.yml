name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      ap_version:
        description: "Archipelago release to bundle and test against (default: the one pinned in the Dockerfile)"
        required: false
        default: ""

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            manager/requirements.txt
            tests/requirements.txt

      - name: Find the Archipelago version
        id: ap
        env:
          REQUESTED: ${{ inputs.ap_version }}  # handed over as data: inside the script it could add commands of its own
        run: |
          version="$REQUESTED"
          if [ -z "$version" ]; then
            version="$(sed -n 's/^ARG AP_VERSION=//p' Dockerfile | head -1)"
          fi
          case "$version" in ''|*[!0-9.]*) echo "Not an Archipelago release: $version" >&2; exit 1 ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Testing against Archipelago $version"

      - name: Fetch Archipelago
        env:
          AP_VERSION: ${{ steps.ap.outputs.version }}
        run: git clone --depth 1 --branch "$AP_VERSION" https://github.com/ArchipelagoMW/Archipelago.git "$RUNNER_TEMP/archipelago"

      # The same steps as the Dockerfile, so a broken requirement shows up here as well as in the image build.
      - name: Install Archipelago's requirements
        working-directory: ${{ runner.temp }}/archipelago
        run: |
          python -m venv "$RUNNER_TEMP/venv-ap"
          grep -v -i -E '^(kivy|kivymd|pyshortcuts)' requirements.txt > "$RUNNER_TEMP/core-requirements.txt"
          "$RUNNER_TEMP/venv-ap/bin/pip" install -r "$RUNNER_TEMP/core-requirements.txt" "setuptools>=75,<81" requests
          for requirements in worlds/*/requirements.txt; do
            "$RUNNER_TEMP/venv-ap/bin/pip" install -r "$requirements" --constraint "$RUNNER_TEMP/core-requirements.txt"
          done

      - name: Install the manager's and the tests' requirements
        run: pip install -r tests/requirements.txt ruff

      - name: Lint
        run: ruff check manager tests

      - name: Check JavaScript syntax
        run: |
          for file in $(find manager/archipelago_manager/static/js -name '*.js'); do
            node --check --input-type=module < "$file" || { echo "syntax error in $file"; exit 1; }
          done

      - name: Test
        env:
          AP_DIR: ${{ runner.temp }}/archipelago
          AP_PYTHON: ${{ runner.temp }}/venv-ap/bin/python
        run: pytest --basetemp "$RUNNER_TEMP/pytest"

      - name: Keep the server logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: server-logs
          path: ${{ runner.temp }}/pytest/**/*.log
          if-no-files-found: ignore

  # One image per platform, each built and smoke tested on a runner of its own architecture (no emulation), then
  # published by digest. The publish job puts them together under the tags.
  docker:
    name: Build image (${{ matrix.arch }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      # Images come from the default branch and version tags only. Other branches, such as the ones the Archipelago
      # update workflow opens, are built and smoke tested but not published.
      PUBLISH: ${{ github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/')) }}
    steps:
      - uses: actions/checkout@v7

      - name: Work out names
        id: names
        env:
          REQUESTED: ${{ inputs.ap_version }}  # handed over as data: inside the script it could add commands of its own
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          version="$REQUESTED"
          if [ -z "$version" ]; then
            version="$(sed -n 's/^ARG AP_VERSION=//p' Dockerfile | head -1)"
          fi
          case "$version" in ''|*[!0-9.]*) echo "Not an Archipelago release: $version" >&2; exit 1 ;; esac
          echo "ap_version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ steps.names.outputs.image }}

      - name: Build for testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: archipelago-manager:smoke
          build-args: |
            AP_VERSION=${{ steps.names.outputs.ap_version }}
            VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      # Runs the image as users of Unraid do (unprivileged user 99:100, game ports published) and plays through a
      # whole generate-host-connect cycle.
      - name: Smoke test the image
        run: |
          docker image inspect --format 'architecture: {{.Architecture}}' archipelago-manager:smoke
          mkdir -p "$RUNNER_TEMP/smoke-config"
          docker run -d --name smoke -p 8080:8080 -p 38281-38300:38281-38300 \
            -v "$RUNNER_TEMP/smoke-config:/config" archipelago-manager:smoke
          # the code for creating the first administrator, which the manager writes at startup (readable for root only)
          for _ in $(seq 60); do docker exec smoke test -s /config/setup-code.txt && break; sleep 2; done
          export SETUP_CODE="$(docker exec smoke cat /config/setup-code.txt)"
          if ! python3 tests/smoke.py http://127.0.0.1:8080 127.0.0.1; then
            docker logs smoke
            exit 1
          fi
          # docker top runs ps on the host (the slim image has none) and insists on a PID column. Only the python
          # process counts: tini, running as root, carries the same words in its arguments.
          echo "--- processes"
          docker top smoke -eo pid,uid,args
          docker top smoke -eo pid,uid,args | awk '
            $3 ~ /(^|\/)python[0-9.]*$/ && $4 == "-m" && $5 == "archipelago_manager" { found = 1; if ($2 != 99) bad = 1 }
            END { exit !(found && !bad) }' || { echo "the manager is not running as user 99"; exit 1; }
          echo "--- data folder ownership"
          docker exec smoke ls -ln /config
          docker exec smoke find /config ! -user 99 -print -quit | grep -q . && { echo "files not owned by 99"; exit 1; } || true
          docker inspect --format '{{json .State.Health.Status}}' smoke
          docker stop --time 30 smoke
          docker logs smoke | tail -20

      - name: Log in to the registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push by digest
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.names.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            AP_VERSION=${{ steps.names.outputs.ap_version }}
            VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}

      - name: Keep the digest
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.push.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Hand the digest to the publish job
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish image
    needs: docker
    if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Work out names
        id: names
        env:
          REQUESTED: ${{ inputs.ap_version }}  # handed over as data: inside the script it could add commands of its own
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          version="$REQUESTED"
          if [ -z "$version" ]; then
            version="$(sed -n 's/^ARG AP_VERSION=//p' Dockerfile | head -1)"
          fi
          case "$version" in ''|*[!0-9.]*) echo "Not an Archipelago release: $version" >&2; exit 1 ;; esac
          echo "ap_version=$version" >> "$GITHUB_OUTPUT"

      - name: Fetch the digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ steps.names.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=ap-${{ steps.names.outputs.ap_version }},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Log in to the registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Put the platforms together under the tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          image="${{ steps.names.outputs.image }}"
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$image@sha256:%s " *)
          docker buildx imagetools inspect "$image:$(jq -r '.tags[0] | split(":")[-1]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
